services:
  # API gateway service
  api_gateway:
    container_name: "api_gateway"
    build: ./http-api-gateway # This will look for Dockerfile in this folder
    ports:
      - "3000:3000"
    volumes:
      - ./http-api-gateway/src:/usr/src/app/src # update docker volume on chnage in main.js
    command: npm run start:dev
    environment:
      - PORT=3000
    depends_on:
      - nats

  # Users microservice
  users_microservice:
    container_name: "users_microservice"
    build: ./users-microservice
    volumes:
      - ./users-microservice/src:/usr/src/app/src
    command: npm run start:dev
    depends_on:
      - mongo_db
      - nats

  # Products microservice
  products_microservice:
    container_name: "products_microservice"
    build: ./products-microservice
    volumes:
      - ./products-microservice/src:/usr/src/app/src
    command: npm run start:dev
    depends_on:
      - mongo_db
      - nats

  # Carts microservice
  carts_microservice:
    container_name: "carts_microservice"
    build: ./carts-microservice
    volumes:
      - ./carts-microservice/src:/usr/src/app/src
    command: npm run start:debug
    depends_on:
      - redis
      - nats


  # Orders microservice
  orders_microservice:
    container_name: "orders_microservice"
    build: ./orders-microservice
    volumes:
      - ./orders-microservice/src:/usr/src/app/src
    command: npm run start:dev
    depends_on:
      - redis
      - nats
      - mysql_db
    
  # Payments microservice
  # payments_microservice:
  #   container_name: "payments_microservice"
  #   build: ./payments-microservice
  #   volumes:
  #     - ./payments-microservice/src:/usr/src/app/src
  #   command: npm run start:dev

  # NATS service setup
  nats:
    image: nats
    container_name: nats_container
    ports:
      - 4222:4222 # external port : internal port

  # MySQL DB
  mysql_db:
    build:
      context: infra/mysql_db/
      dockerfile: Dockerfile
    container_name: mysql_db_container
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    # environment:
    #   - MYSQL_ROOT_PASSWORD=root_123
    #   - MYSQL_USER=test_user
    #   - MYSQL_DATABASE=orders_management
    #   - MYSQL_PASSWORD=test_pwd
    #   - MYSQL_TCP_PORT=3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpmyadmin
  phpmyadmin:
    depends_on:
      - mysql_db
    image: phpmyadmin
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: test_pwd

  # MongoDB DB
  mongo_db:
    image: mongo
    container_name: mongo_db_container
    ports:
      - "27027:27017"  # Host port 27017 mapped to container port 27017
    volumes:
      - ./mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password

  # Redis Service
  redis:
    image: redis
    container_name: redis_container
    ports:
      - "6380:6379"
    volumes:
      - ./redis-data:/data
    command: ["redis-server", "--requirepass", "new_password"]
    environment:
      - REDIS_PASSWORD=new_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "new_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3